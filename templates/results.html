<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შედეგების სია</title>
</head>
<body>
    <h1>შიდა ხარისხის კონტროლის შედეგები</h1>
    <table border="1">
        <tr>
            <th>ტესტი</th>
            <th>LOT</th>
            <th>შედეგი</th>
            <th>თარიღი</th>
            <th>დონე</th>
            <th>მინ</th>
            <th>მაქს</th>
        </tr>
        {% for r in results %}
        <tr>
            <td>{{ r.test_name }}</td>
            <td>{{ r.lot_number }}</td>
            <td>{{ r.result }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.level }}</td>
            <td>{{ r.min }}</td>
            <td>{{ r.max }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/"><button>მთავარ გვერდზე დაბრუნება</button></a>
</body>
</html>
