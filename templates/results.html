<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შედეგების ნახვა</title>
    <style>
        body {
            font-family: "Sylfaen", sans-serif;
            padding: 30px;
            background-color: #f8f8f8;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 10px 15px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .in-range {
            color: green;
            font-weight: bold;
        }

        .out-of-range {
            color: red;
            font-weight: bold;
        }

        .back-button {
            margin-top: 20px;
            display: inline-block;
        }

        .back-button button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            background-color: #3c8dbc;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .back-button button:hover {
            background-color: #367fa9;
        }
    </style>
</head>
<body>
    <h1>შიდა ხარისხის კონტროლის შედეგები</h1>

    <table>
        <thead>
            <tr>
                <th>ტესტი</th>
                <th>LOT</th>
                <th>შედეგი</th>
                <th>თარიღი</th>
                <th>დონე</th>
                <th>მინ</th>
                <th>მაქს</th>
                <th>მოქმედება</th>
            </tr>
        </thead>
        <tbody>
            {% for r in results %}
            <tr>
                <td>{{ r.test_name }}</td>
                <td>{{ r.lot_number }}</td>
                <td class="{% if r.result|float >= r.min|float and r.result|float <= r.max|float %}in-range{% else %}out-of-range{% endif %}">
                    {{ r.result }}
                </td>
                <td>{{ r.date }}</td>
                <td>{{ r.level }}</td>
                <td>{{ r.min }}</td>
                <td>{{ r.max }}</td>
                <td>
                    <a href="{{ url_for('edit_result', result_id=r.id) }}">✏️</a>
                    |
                    <a href="{{ url_for('delete_result', result_id=r.id) }}" onclick="return confirm('დარწმუნებული ხარ რომ გინდა წაშლა?')">🗑️</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="back-button">
        <a href="/"><button>მთავარ გვერდზე დაბრუნება</button></a>
    </div>
</body>
</html>
