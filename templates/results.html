<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შედეგების გვერდი</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f7f7f7;
            padding: 30px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
        }
        .green {
            background-color: #e0f7e9;
            color: #1c662d;
            font-weight: bold;
        }
        .red {
            background-color: #fddede;
            color: #b70000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>შიდა ხარისხის კონტროლის შედეგები</h2>
    <table>
        <tr>
            <th>ტესტი</th>
            <th>LOT</th>
            <th>შედეგი</th>
            <th>თარიღი</th>
            <th>დონე</th>
            <th>მინ</th>
            <th>მაქს</th>
            <th>გადაკალიბრდა</th>
            <th>კონტროლის რეტესტი</th>
        </tr>
        {% for r in results %}
        <tr>
            <td>{{ r.test_name }}</td>
            <td>{{ r.lot_number }}</td>
            <td class="{% if r.result|float < r.min|float or r.result|float > r.max|float %}red{% else %}green{% endif %}">{{ r.result }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.level }}</td>
            <td>{{ r.min }}</td>
            <td>{{ r.max }}</td>
            <td>{{ r.recalibrated or '-' }}</td>
            <td>{{ r.retest_result or '-' }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <div style="text-align: center;">
        <a href="/"><button>მთავარ გვერდზე დაბრუნება</button></a>
    </div>
</body>
</html>
