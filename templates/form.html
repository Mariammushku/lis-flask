<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შედეგების შეყვანა</title>
</head>
<body>
    <h1>შეიყვანე ტესტის შედეგი</h1>
    <form method="POST">

        <label for="branch">აირჩიე ფილიალი:</label>
        <select name="branch" required>
            <option value="">აირჩიე ფილიალი</option>
            <option value="თბილისი">თბილისი</option>
            <option value="ქუთაისი">ქუთაისი</option>
            <option value="ზუგდიდი">ზუგდიდი</option>
        </select>
        <br><br>

        <label for="test_name">ტესტის სახელი:</label>
        <input type="text" name="test_name" required><br><br>

        <label for="result">შედეგი:</label>
        <input type="text" name="result" required><br><br>

        <label for="date">თარიღი:</label>
        <input type="date" name="date" required><br><br>

        <label for="level">დონე:</label>
        <select name="level" required>
            <option value="">აირჩიე დონე</option>
            <option value="LOW">LOW</option>
            <option value="NORMAL">NORMAL</option>
            <option value="HIGH">HIGH</option>
        </select>
        <br><br>

        <label for="min">მინიმალური:</label>
        <input type="number" step="any" name="min" required><br><br>

        <label for="max">მაქსიმალური:</label>
        <input type="number" step="any" name="max" required><br><br>

        <label for="lot_number">LOT ნომერი:</label>
        <input type="text" name="lot_number"><br><br>

        <label for="recalibrated">გადაკალიბრებულია?:</label>
        <input type="checkbox" name="recalibrated"><br><br>

        <label for="retest_result">გადამოწმების შედეგი:</label>
        <input type="text" name="retest_result"><br><br>

        <button type="submit">შენახვა</button>
    </form>
</body>
</html>
