<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შეიყვანე შედეგი</title>
</head>
<body>
    <h1>შეიყვანე ხარისხის კონტროლის მონაცემები</h1>

    <form method="POST">
        <label>ტესტის სახელი:</label><br>
        <select name="test_name">
            <option value="ALT/ GPT">ალანინამინოტრანსფერაზა ALT/ GPT</option>
            <option value="AST/ GOT">ასპარტატამინოტრანსფერაზა AST/ GOT</option>
            <option value="GGT">გამაგლუტამილტრანსფერაზა GGT</option>
            <option value="PTO">საერთო ცილა PTO</option>
            <option value="ALB">ალბუმინი ALB</option>
            <option value="GLU">გლუკოზა GLU</option>
            <option value="CHO">ქოლესტერინი CHO</option>
            <option value="TRG">ტრიგლიცერიდი TRG</option>
            <option value="HDL">მაღალი სიმკვრივის ლპ- ქოლესტერინი HDL</option>
            <option value="LIP">ლიპაზა LIP</option>
            <option value="PHO">ფოსფორი PHO</option>
            <option value="FE">რკინა FE</option>
            <option value="Ca">კალციუმი Ca</option>
            <option value="RF">რევმატოიდული ფაქტორი RF</option>
            <option value="ALK">ტუტე ფოსფატაზა ALK</option>
            <option value="Mg">მაგნიუმი Mg</option>
        </select><br><br>

        <label>LOT Number:</label><br>
        <input type="text" name="lot_number"><br><br>

        <label>შედეგი:</label><br>
        <input type="text" name="result"><br><br>

        <label>თარიღი:</label><br>
        <input type="date" name="date"><br><br>

        <label>დონე:</label><br>
        <select name="level">
            <option value="Low">Low</option>
            <option value="Normal">Normal</option>
            <option value="High">High</option>
        </select><br><br>

        <label>მინიმალური ზღვარი:</label><br>
        <input type="text" name="min"><br><br>

        <label>მაქსიმალური ზღვარი:</label><br>
        <input type="text" name="max"><br><br>

        <button type="submit">გაგზავნა</button>
    </form>

    <br><br>

    <div style="padding: 10px; border: 1px solid #ccc; display: inline-block;">
        <a href="{{ url_for('results') }}">
            <button type="button">შედეგების ნახვა</button>
        </a>
    </div>
</body>
</html>
