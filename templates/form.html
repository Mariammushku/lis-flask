<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>მონაცემების შეყვანა</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        form {
            width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .nav-button {
            display: block;
            margin: 20px auto 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>შეიყვანე ხარისხის კონტროლის მონაცემები</h1>
    <form method="POST">
        <label>ტესტის სახელი:</label>
        <select name="test_name" required>
            <option value="">-- აირჩიეთ ტესტი --</option>
            <option>ALT/ GPT</option>
            <option>AST/ GOT</option>
            <option>GGT</option>
            <option>PTO</option>
            <option>ALB</option>
            <option>GLU</option>
            <option>CHO</option>
            <option>TRG</option>
            <option>HDL</option>
            <option>LIP</option>
            <option>PHO</option>
            <option>FE</option>
            <option>Ca</option>
            <option>RF</option>
            <option>ALK</option>
            <option>Mg</option>
        </select>

        <label>LOT Number:</label>
        <input type="text" name="lot_number" required>

        <label>შედეგი:</label>
        <input type="text" name="result" required>

        <label>თარიღი:</label>
        <input type="date" name="date" required>

        <label>დონე:</label>
        <select name="level" required>
            <option value="Low">Low</option>
            <option value="Normal">Normal</option>
            <option value="High">High</option>
        </select>

        <label>მინიმალური ზღვარი:</label>
        <input type="text" name="min" required>

        <label>მაქსიმალური ზღვარი:</label>
        <input type="text" name="max" required>

        <label>გადაკალიბრდა? (დიახ / არა):</label>
        <input type="text" name="recalibrated">

        <label>კონტროლის რეტესტის შედეგი:</label>
        <input type="text" name="retest_result">

        <button type="submit">შენახვა</button>
    </form>

    <div class="nav-button">
        <a href="/results"><button>შედეგების ნახვა</button></a>
    </div>
</body>
</html>
