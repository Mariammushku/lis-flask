<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>შედეგის ჩასწორება</title>
    <style>
        body {
            font-family: "Sylfaen", sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #3c8dbc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background-color: #367fa9;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #3c8dbc;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>შედეგის ჩასწორება</h1>

    <form method="POST">
        <label>ტესტის სახელი:</label>
        <input type="text" name="test_name" value="{{ result.test_name }}">

        <label>LOT ნომერი:</label>
        <input type="text" name="lot_number" value="{{ result.lot_number }}">

        <label>შედეგი:</label>
        <input type="text" name="result" value="{{ result.result }}">

        <label>თარიღი:</label>
        <input type="date" name="date" value="{{ result.date }}">

        <label>დონე:</label>
        <input type="text" name="level" value="{{ result.level }}">

        <label>მინიმალური ზღვარი:</label>
        <input type="text" name="min" value="{{ result.min }}">

        <label>მაქსიმალური ზღვარი:</label>
        <input type="text" name="max" value="{{ result.max }}">

        <button type="submit">შენახვა</button>
    </form>

    <div class="back">
        <a href="{{ url_for('results') }}">← დაბრუნება შედეგების გვერდზე</a>
    </div>
</body>
</html>
